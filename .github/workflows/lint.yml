name: Lint

on:
  pull_request:
  push:
    branches:
      - main
      - release/**
      - v*

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}-lint
  cancel-in-progress: true

env:
  go-version: "1.26.4"
  vuln-version: "v1.1.4"

jobs:
  golangci:
    uses: getoptimum/.github/.github/workflows/go-lint.yml@398f1436255c41d176b673c771dce8d52e657ca5 # getoptimum/.github#7
    secrets:
      GH_APP_ID: ${{ secrets.GH_APP_ID }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    # Run on PRs and on version tags; skip for normal non-tag pushes to branches
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.go-version }}
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.vuln-version }}

      - name: Run dependency vulnerability scan (fail on reachable only)
        run: |
          # Gate policy: fail only on REACHABLE vulnerabilities (a vulnerable
          # package we import, or a symbol we call). Module-only findings, i.e.
          # advisories in modules we require but whose vulnerable package we do
          # not import, are reported for visibility but never block: there is
          # nothing to call and often no fixed version. Reachable findings can
          # still be explicitly accepted by ID in govulncheck.yaml.

          # Accepted IDs, anchored so one ID cannot substring-match another.
          ACCEPT_RE="^($(awk '/- id:/ {print $3}' govulncheck.yaml | paste -sd '|' -))$"
          [ "$ACCEPT_RE" = "^()$" ] && ACCEPT_RE='^$'  # empty accept-list: match nothing

          echo "Running govulncheck (JSON)..."
          set +e
          govulncheck -format json ./... > /tmp/govulncheck.json 2> /tmp/govulncheck.err
          gv_exit=$?
          set -e

          # A real crash is a non-zero exit with no parseable JSON to work from.
          if [ "$gv_exit" -ne 0 ] && ! jq -e . /tmp/govulncheck.json >/dev/null 2>&1; then
            echo "❌ govulncheck failed with exit code $gv_exit"
            cat /tmp/govulncheck.err
            exit "$gv_exit"
          fi

          # Reachability is set by the first trace frame: a populated "package"
          # means imported or called; only "module" means required-but-uncalled.
          reachable=$(jq -rc 'select(.finding).finding | select((.trace[0].package // "") != "") | .osv' /tmp/govulncheck.json | sort -u)
          all_ids=$(jq -rc 'select(.finding).finding.osv' /tmp/govulncheck.json | sort -u)
          module_only=$(comm -23 <(printf '%s\n' "$all_ids" | grep -v '^$') <(printf '%s\n' "$reachable" | grep -v '^$'))

          echo "Reachable (imported/called): ${reachable:-none}"
          echo "Module-only (required, not called): ${module_only:-none}"

          # Block only on reachable findings that are not accepted.
          blocking=$(printf '%s\n' "$reachable" | grep -v '^$' | grep -Ev "$ACCEPT_RE" || true)

          if [ -n "$blocking" ]; then
            echo "❌ Reachable, non-accepted vulnerabilities:"
            echo "$blocking"
            echo "   Fix them, or document in govulncheck.yaml if the risk is accepted."
            exit 1
          fi

          echo "✅ No reachable, non-accepted vulnerabilities."
          echo "   (Module-only advisories on required-but-uncalled modules are informational.)"
