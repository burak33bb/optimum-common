services:
  proxy-1:
    image: getoptimum/proxy:valentyn-lean
    ports:
      - "8081:8080"
      - "50051:50051"
    volumes:
      - ./config:/app/config
    environment:
      - PROXY_HTTP_PORT=:8080
      - PROXY_GRPC_PORT=:50051
      - CONFIG_PATH=/app/config/proxy.yaml
      - ENABLE_DEBUG=true
      - P2P_NODES=p2pnode-1:33212,p2pnode-2:33212,p2pnode-3:33212,p2pnode-4:33212
    networks:
      optimum-network:
        ipv4_address: 172.28.0.10
    depends_on:
      - p2pnode-1
      - p2pnode-2
      - p2pnode-3
      - p2pnode-4

  proxy-2:
    image: getoptimum/proxy:valentyn-lean
    ports:
      - "8082:8080"
      - "50052:50051"
    volumes:
      - ./config:/app/config
    environment:
      - PROXY_HTTP_PORT=:8080
      - PROXY_GRPC_PORT=:50051
      - CONFIG_PATH=/app/config/proxy.yaml
      - ENABLE_DEBUG=true
      - P2P_NODES=p2pnode-1:33212,p2pnode-2:33212,p2pnode-3:33212,p2pnode-4:33212
    networks:
      optimum-network:
        ipv4_address: 172.28.0.11
    depends_on:
      - p2pnode-1
      - p2pnode-2
      - p2pnode-3
      - p2pnode-4

  p2pnode-1:
    image: getoptimum/p2pnode:valentyn-lean
    volumes:
      - ./config:/app/config
      - ./identity:/tmp
    environment:
      - CONFIG_PATH=/app/config/p2pnode.yaml
    networks:
      optimum-network:
        ipv4_address: 172.28.0.12
    ports:
      - "33221:33212"
      - "7071:7070"
      - "6061:6060"
      - "9091:9090"

